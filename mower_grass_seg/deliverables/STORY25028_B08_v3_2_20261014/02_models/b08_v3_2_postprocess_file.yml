# "acuity_postprocs" allowed types: "classification_validate, detection_validate, dump_results, print_topn, classification_classic, mute_built_in_actions"
postprocess:
  acuity_postprocs:
    print_topn:
      topn: 5
    dump_results:
      file_type: TENSOR
  app_postprocs:
  - lid: attach_output0/out0_0
    postproc_params:
      add_postproc_node: true
      perm:
      - 0
      - 1
      - 2
      force_float32: true
  - lid: attach_output1/out0_1
    postproc_params:
      add_postproc_node: true
      perm:
      - 0
      - 1
      - 2
      - 3
      force_float32: true
